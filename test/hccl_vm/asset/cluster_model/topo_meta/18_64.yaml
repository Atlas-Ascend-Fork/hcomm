# 1dpod64: 1个超节点/8个POD, 共512卡
# POD形态(4层拓扑: board -> pod -> 超节点 -> cluster): ranks为**board内物理id**
# 规模: 1个超节点 x 8个POD/超节点 x 8个board/POD x 8卡/board = 512个rank

# 1. 全局统计信息 podNum, serNum, boardNum, rankNum 都小于 1024
#    (serNum/boardNum/rankNum均为**全集群总数**, 与既有meta字段口径一致)
meta:
  podNum: 1
  serNum: 8
  boardNum: 64
  rankNum: 512

# 2. 详细拓扑结构
topology:
  - podId: 0
    servers:
      - serId_range: [0, 7]
        boards:
          - {boardId_range: [0, 7], ranks_range: [0, 7]}
