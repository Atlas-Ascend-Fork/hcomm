# normal组网: 2个超节点/每超节点16个server/每server 8卡
# server形态(3层拓扑: server -> 超节点 -> cluster): ranks为server内物理id
# 规模: 2个超节点 x 16个server/超节点 x 8卡/server = 256个rank

# 1. 全局统计信息 podNum, serNum, rankNum 都小于 1024
meta:
  podNum: 2
  serNum: 32
  rankNum: 256

# 2. 详细拓扑结构
topology:
  - podId: 0
    servers:
      - serId_range: [0, 15]
        ranks_range: [0, 7]
  - podId: 1
    servers:
      - serId_range: [0, 15]
        ranks_range: [0, 7]
